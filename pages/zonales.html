<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Operaciones - Selección Operativa</title>
<style>
:root {
  --color-tmnt-bg: #121412;
  --color-tmnt-green-dark: #1e241e;
  --color-tmnt-card: #2a302a; 
  --color-accent: #87ab87;
  --color-text: #e0e0e0;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
  font-family: 'Segoe UI', Tahoma, sans-serif; 
  background-color: var(--color-tmnt-bg);
  /* Patrón de caparazón ninja */
  background-image: 
    radial-gradient(circle at center, rgba(45, 51, 45, 0.8) 0%, transparent 70%),
    linear-gradient(30deg, #1a1f1a 12%, transparent 12.5%, transparent 87%, #1a1f1a 87.5%, #1a1f1a),
    linear-gradient(150deg, #1a1f1a 12%, transparent 12.5%, transparent 87%, #1a1f1a 87.5%, #1a1f1a),
    linear-gradient(30deg, #1a1f1a 12%, transparent 12.5%, transparent 87%, #1a1f1a 87.5%, #1a1f1a),
    linear-gradient(150deg, #1a1f1a 12%, transparent 12.5%, transparent 87%, #1a1f1a 87.5%, #1a1f1a),
    linear-gradient(60deg, #222a22 25%, transparent 25.5%, transparent 75%, #222a22 75.5%, #222a22),
    linear-gradient(60deg, #222a22 25%, transparent 25.5%, transparent 75%, #222a22 75.5%, #222a22);
  background-size: 80px 140px;
  color: var(--color-text);
  padding: 20px;
}

.tn-header {
  background: rgba(0,0,0,0.7); padding: 25px;
  border-radius: 12px; border-bottom: 4px solid #3d4f3d;
  margin-bottom: 25px; text-align: center;
}

.header-text h1 { font-size: 22px; letter-spacing: 2px; color: white; text-transform: uppercase; }
.header-text p { font-size: 12px; color: var(--color-accent); font-weight: bold; margin-top: 5px; }

.selector-container {
  display: flex; gap: 20px; padding: 0 0 25px; overflow-x: auto;
  border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 25px;
}
.selector-group { display: flex; flex-direction: column; gap: 8px; }
.group-label { font-size: 10px; text-transform: uppercase; color: #666; font-weight: 700; }
.sel-btn { 
  padding: 8px 16px; border-radius: 6px; border: 1px solid #333; 
  background: #1a1c1a; color: #888; cursor: pointer; font-size: 13px;
}
.sel-btn.active { background: var(--color-accent); color: #1a1c1a; font-weight: 700; border-color: var(--color-accent); }

.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px; margin-bottom: 25px;
}
.stat-item {
  background: rgba(30, 36, 30, 0.9); border: 1px solid var(--color-accent);
  padding: 15px; border-radius: 10px; text-align: center; backdrop-filter: blur(5px);
}
.stat-item label { font-size: 10px; text-transform: uppercase; color: var(--color-accent); font-weight: bold; }
.stat-item span { display: block; font-size: 26px; font-weight: 800; color: white; }

.search-bar { 
  width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.6); 
  border: 1px solid var(--color-accent); border-radius: 8px; 
  color: white; margin-bottom: 25px;
}

.zona-title { color: var(--color-accent); text-transform: uppercase; margin: 30px 0 15px; font-size: 13px; font-weight: 700; border-left: 4px solid var(--color-accent); padding-left: 10px; }

.cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }

.gte-card {
  background: var(--color-tmnt-card); padding: 18px; border-radius: 12px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.03);
}

.gte-card h3 { font-size: 15px; color: white; display: flex; justify-content: space-between; }
.regional-name { font-size: 11px; color: var(--color-accent); margin: 5px 0 10px; }

.brand-tag {
  display: inline-block; font-size: 9px; padding: 3px 10px; border-radius: 4px;
  text-transform: uppercase; font-weight: 800; margin-bottom: 12px;
}
.ext { background: #4a2424; color: #ff8a8a; }
.sab { background: #4a3e24; color: #ffca8a; }

.locales-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 12px; }
.local-tag { background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 15px; font-size: 10px; color: #c4d4c9; }
</style>
</head>
<body>

let activeG = 'todos';

function setGerencia(g) {
  activeG = g;
  document.querySelectorAll('.sel-btn').forEach(b => {
    b.classList.toggle('active', b.innerText.includes(g) || (g === 'todos' && b.innerText.includes('Todos')));
  });
  render();
}

function render() {
  const query = document.getElementById('filtro').value.toLowerCase();
  const container = document.getElementById('main-content');
  container.innerHTML = "";

  let filtrados = activeG === 'todos' ? DATA : DATA.filter(d => d.g === activeG);
  if (query) {
    filtrados = filtrados.filter(d => d.n.toLowerCase().includes(query) || d.l.some(loc => loc.toLowerCase().includes(query)));
  }

  document.getElementById('stat-total').innerText = filtrados.length;
  document.getElementById('stat-locales').innerText = filtrados.reduce((acc, d) => acc + d.l.length, 0);
  document.getElementById('stat-ext').innerText = filtrados.filter(d => d.m === "EXT").length;
  document.getElementById('stat-sab').innerText = filtrados.filter(d => d.m === "SAB").length;

  ["CABA", "Norte", "Sur", "Oeste", "Interior"].forEach(z => {
    const porZona = filtrados.filter(d => d.z === z);
    if(porZona.length > 0) {
      container.innerHTML += `<div class="zona-title">ZONA ${z}</div><div class="cards-container" id="grid-${z}"></div>`;
      porZona.forEach(item => {
        document.getElementById(`grid-${z}`).innerHTML += `
          <div class="gte-card">
            <h3>${item.n} <span style="font-size:9px; opacity:0.5;">${item.g}</span></h3>
            <div class="regional-name">Reg: ${item.r}</div>
            <span class="brand-tag ${item.m === 'EXT' ? 'ext' : 'sab'}">${item.m === 'EXT' ? 'Extremas' : 'Sabores Express'}</span>
            <div class="locales-list">${item.l.map(loc => `<span class="local-tag">${loc}</span>`).join('')}</div>
          </div>`;
      });
    }
  });
}
render();
